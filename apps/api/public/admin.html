<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>DriveMaster Admin</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  section { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 0.5rem; margin: 0.3rem 0; }
  textarea { min-height: 140px; font-family: monospace; }
  button { padding: 0.5rem 1rem; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border-bottom: 1px solid #ddd; padding: 0.4rem; text-align: left; font-size: 0.9rem; }
  .msg { font-size: 0.9rem; margin-top: 0.5rem; }
  .msg.ok { color: green; }
  .msg.err { color: crimson; }
body{background:#090f1c;color:#eaf0fc;max-width:1120px;margin:0 auto;padding:26px 18px;font-family:Inter,system-ui,sans-serif}h1{font-size:29px;color:#f1ca87}h2{font-size:18px;color:#f2d49d}section{background:#141f32;border:1px solid #30415e;border-radius:18px;padding:22px;box-shadow:0 12px 40px #0002}input,select,textarea{background:#0a1426;color:#eaf0fc;border:1px solid #40506a;border-radius:9px}button{background:#edc47d;color:#172033;border:0;border-radius:9px;padding:10px 14px;font-weight:700;margin:4px;cursor:pointer}th,td{border-color:#30415e}.msg.ok{color:#8cdbb1}.msg.err{color:#ff9b9b}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.metric{background:#0c1729;border:1px solid #33425e;padding:16px;border-radius:13px}.metric strong{display:block;color:#f2d49d;font-size:32px;margin-top:9px}.metric span{color:#aab7cb;font-size:13px}.chart{display:flex;align-items:end;gap:10px;height:125px;margin:20px 0 0}.chart div{flex:1;background:linear-gradient(#f4d69a,#997246);border-radius:5px 5px 0 0}.labels{display:flex;gap:10px}.labels span{flex:1;text-align:center;color:#aab7cb;font-size:11px}@media(max-width:650px){.metrics{grid-template-columns:repeat(2,1fr)}section{padding:14px}#users-section{overflow:auto}} </style>
</head>
<body>
<h1>DriveMaster — Admin</h1>

<section id="login-section">
  <h2>Kirish</h2>
  <input id="token-input" type="password" placeholder="Admin token" />
  <button onclick="saveToken()">Kirish</button>
</section>

<section id="users-section" style="display:none">
  <h2>Foydalanuvchilar statistikasi</h2><div class="metrics"><div class="metric"><span>Jami foydalanuvchilar</span><strong id="stat-total">—</strong></div><div class="metric"><span>Oxirgi 24 soat</span><strong id="stat-today">—</strong></div><div class="metric"><span>Oxirgi 7 kun</span><strong id="stat-week">—</strong></div><div class="metric"><span>Premium</span><strong id="stat-premium">—</strong></div></div><h2>7 kunlik o‘sish</h2><div class="chart" id="chart"></div><div class="labels" id="chart-labels"></div><p><input id="user-search" placeholder="Ism, username yoki ID bo‘yicha qidirish" oninput="filterUsers()" /></p>
  <button onclick="loadUsers()">Yangilash</button>
  <table id="users-table">
    <thead><tr><th>Telegram ID</th><th>Premium</th><th>Yaratilgan</th><th>Amal</th></tr></thead>
    <tbody></tbody>
  </table>
</section>

<section id="import-section" style="display:none">
  <h2>Kontent import (JSON)</h2>
  <select id="import-type">
    <option value="cities">Shaharlar (cities)</option>
    <option value="psych-centers">Psixolog markazlar (psychCenters)</option>
    <option value="instructors">Instruktorlar (instructors)</option>
    <option value="theory-questions">Teoriya savollari (theoryQuestions)</option>
    <option value="psych-questions">Psixologik savollar (psychQuestions)</option>
    <option value="theory-videos">Videolar (theoryVideos)</option>
  </select>
  <textarea id="import-json" placeholder='[{"name": "Warszawa", "difficultyScore": 2, "notes": "..."}]'></textarea>
  <button onclick="submitImport()">Import qilish</button>
  <div id="import-msg" class="msg"></div>
</section>

<script>
  let sessionToken = ''; let cachedUsers = [];
  function getToken() { return sessionToken; }

  function saveToken() {
    const t = document.getElementById('token-input').value.trim();
    if (!t) return;
    sessionToken = t; document.getElementById('token-input').value = '';
    afterLogin();
  }

  function afterLogin() {
    document.getElementById('users-section').style.display = 'block';
    document.getElementById('import-section').style.display = 'block';
    loadUsers();
  }

  async function api(path, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: {
        'x-admin-token': getToken(),
        'Content-Type': 'application/json',
        ...(options.headers || {}),
      },
    });
    if (res.status === 401) {
      sessionToken = '';
      alert('Token noto\'g\'ri. Qayta kiriting.');
      location.reload();
      throw new Error('Unauthorized');
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || 'Xatolik yuz berdi');
    return data;
  }

  async function loadUsers() {
    const users = await api('/admin/users');
    cachedUsers = users;
    const day=86400000, now=Date.now();
    document.getElementById('stat-total').textContent=users.length;
    document.getElementById('stat-today').textContent=users.filter(u=>now-new Date(u.createdAt)<day).length;
    document.getElementById('stat-week').textContent=users.filter(u=>now-new Date(u.createdAt)<7*day).length;
    document.getElementById('stat-premium').textContent=users.filter(u=>u.isPremium).length;
    const ds=Array.from({length:7},(_,i)=>{let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+i);return {d,n:users.filter(u=>new Date(u.createdAt)>=d&&new Date(u.createdAt)<new Date(d.getTime()+day)).length}}),max=Math.max(1,...ds.map(x=>x.n));
    document.getElementById('chart').innerHTML=ds.map(x=>'<div title="'+x.n+' ta" style="height:'+Math.max(3,x.n/max*100)+'%"></div>').join('');
    document.getElementById('chart-labels').innerHTML=ds.map(x=>'<span>'+x.d.toLocaleDateString('uz-UZ',{day:'numeric',month:'short'})+'</span>').join('');
    const tbody = document.querySelector('#users-table tbody');
    tbody.innerHTML = '';
    for (const u of users) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${String(u.telegramId).replace(/[^0-9]/g,'')}</td>
        <td>${u.isPremium ? '✅' : '—'}</td>
        <td>${new Date(u.createdAt).toLocaleString()}</td>
        <td><button onclick="togglePremium('${u.id}', ${!u.isPremium})">${u.isPremium ? 'Bekor qilish' : 'Premium berish'}</button></td>
      `;
      tbody.appendChild(tr);
    }
    filterUsers();
  }
  function filterUsers(){const q=document.getElementById('user-search').value.toLowerCase();const rows=document.querySelectorAll('#users-table tbody tr');rows.forEach((row,i)=>{const u=cachedUsers[i];row.style.display=[u.telegramId,u.username,u.firstName].join(' ').toLowerCase().includes(q)?'':'none'})}

  async function togglePremium(id, grant) {
    await api(`/admin/users/${id}/${grant ? 'grant-premium' : 'revoke-premium'}`, { method: 'POST' });
    loadUsers();
  }

  async function submitImport() {
    const type = document.getElementById('import-type').value;
    const msgEl = document.getElementById('import-msg');
    msgEl.textContent = '';
    msgEl.className = 'msg';
    let body;
    try {
      body = JSON.parse(document.getElementById('import-json').value);
    } catch (e) {
      msgEl.textContent = 'JSON noto\'g\'ri formatda: ' + e.message;
      msgEl.className = 'msg err';
      return;
    }
    try {
      const result = await api(`/admin/import/${type}`, { method: 'POST', body: JSON.stringify(body) });
      msgEl.textContent = `Muvaffaqiyatli: ${result.imported} ta yozuv import qilindi.`;
      msgEl.className = 'msg ok';
    } catch (e) {
      msgEl.textContent = 'Xatolik: ' + e.message;
      msgEl.className = 'msg err';
    }
  }


</script>
</body>
</html>

  var root = document.getElementById("lang");
  var btn = document.getElementById("lang-btn");
  var menu = document.getElementById("lang-menu");

  function apply(lang) {
    var d = T[lang] || T.uz;
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var k = el.getAttribute("data-i18n");
      if (d[k] !== undefined) el.innerHTML = d[k];
    });
    var cur = LANGS.filter(function (l) { return l.code === lang; })[0] || LANGS[0];
    document.getElementById("lang-flag").innerHTML = cur.flag;
    document.getElementById("lang-code").textContent = cur.code.toUpperCase();
    menu.querySelectorAll(".lang-opt").forEach(function (o) {
      o.classList.toggle("on", o.getAttribute("data-lang") === lang);
    });
    try { localStorage.setItem("dm_landing_lang", lang); } catch (e) {}
  }

  LANGS.forEach(function (l) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "lang-opt";
    b.setAttribute("role", "menuitem");
    b.setAttribute("data-lang", l.code);
    b.innerHTML = l.flag + "<span>" + l.label + "</span>";
    b.addEventListener("click", function () {
      apply(l.code);
      root.classList.remove("open");
      btn.setAttribute("aria-expanded", "false");
    });
    menu.appendChild(b);
  });

  btn.addEventListener("click", function (e) {
    e.stopPropagation();
    var open = root.classList.toggle("open");
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.addEventListener("click", function () {
    root.classList.remove("open");
    btn.setAttribute("aria-expanded", "false");
  });

  var fromUrl = null;
  try { fromUrl = new URLSearchParams(location.search).get("lang"); } catch (e) {}
  var stored = null;
  try { stored = localStorage.getItem("dm_landing_lang"); } catch (e) {}
  var browser = (navigator.language || "uz").slice(0, 2);
  var initial = (fromUrl && T[fromUrl]) ? fromUrl : (stored && T[stored]) ? stored : (T[browser] ? browser : "uz");
  apply(initial);
})();
